name: Qualidade do Portal

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    name: Portal / testes e auditorias
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter o código-fonte
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Executar portões de qualidade do Portal
        run: npm run release:check

      - name: Confirmar que arquivos gerados estão sincronizados
        run: git diff --exit-code

  worker:
    name: Worker / bundle de homologação
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: cloudflare/attachment-worker

    steps:
      - name: Obter o código-fonte
        uses: actions/checkout@v6

      - name: Preparar Node.js e cache do npm
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/attachment-worker/package-lock.json

      - name: Instalar dependências bloqueadas
        run: npm ci

      - name: Validar o bundle do Worker sem publicar
        run: npm run check

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00529B">
  <meta name="description" content="Portal público do Lions Clube de Cândido Mota">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=()">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; form-action 'self'; frame-src 'none'">
  <title>Portal Lions • Cândido Mota</title>
  <link rel="icon" type="image/png" href="./public/favicon.png">
  <link rel="apple-touch-icon" href="./public/apple-touch-icon.png">
  <link rel="stylesheet" href="./assets/css/public.css?v=1.1.2">
  <script type="module" src="./assets/js/public-app.js?v=1.1.2"></script>
</head>
<body>
  <a class="skip-link" href="#mainContent">Pular para o conteúdo principal</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Menu principal">
      <div class="brand">
        <div class="brand-logo-wrap"><img id="sidebarLogo" src="./public/logo-ui.webp" alt="Logo do Lions Clube" width="52" height="52"></div>
        <div class="brand-copy"><strong id="sidebarClubName">Lions Clube de Cândido Mota</strong><small>Distrito LB 1</small></div>
      </div>
      <div class="nav-section-label">Menu</div>
      <nav class="nav-list" id="mainNav">
        <button type="button" class="nav-item active" data-view="dashboard" aria-current="page"><span class="nav-icon"><svg class="ui-icon"><use href="./assets/icons/ui-icons.svg#home"></use></svg></span><span>Início</span></button>
        <button type="button" class="nav-item" data-view="birthdays"><span class="nav-icon"><svg class="ui-icon"><use href="./assets/icons/ui-icons.svg#cake"></use></svg></span><span>Aniversários</span></button>
        <button type="button" class="nav-item" data-view="leaders"><span class="nav-icon"><svg class="ui-icon"><use href="./assets/icons/ui-icons.svg#users"></use></svg></span><span>Dirigentes</span></button>
        <button type="button" class="nav-item" data-view="agenda"><span class="nav-icon"><svg class="ui-icon"><use href="./assets/icons/ui-icons.svg#calendar"></use></svg></span><span>Agenda</span></button>
        <button type="button" class="nav-item" data-view="notices"><span class="nav-icon"><svg class="ui-icon"><use href="./assets/icons/ui-icons.svg#megaphone"></use></svg></span><span>Avisos</span></button>
      </nav>
      <div class="sidebar-footer"><small>Servir • Liderar • Transformar</small></div>
    </aside>

    <button class="sidebar-overlay" id="sidebarOverlay" type="button" aria-label="Fechar menu"></button>

    <main class="main-content" id="mainContent" tabindex="-1">
      <header class="topbar">
        <button type="button" class="icon-btn menu-btn" id="menuBtn" aria-label="Abrir menu" aria-expanded="false"><svg class="ui-icon"><use href="./assets/icons/ui-icons.svg#menu"></use></svg></button>
        <div class="topbar-title">
          <h1 id="pageTitle">Início</h1>
          <p id="pageDescription">Acompanhe as novidades do clube</p>
          <small id="currentDate"></small>
        </div>
        <div class="topbar-actions">
          <span class="mode-chip"><svg class="ui-icon"><use href="./assets/icons/ui-icons.svg#globe"></use></svg> Público</span>
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="Ativar modo escuro" aria-pressed="false"><span id="themeIcon">☾</span><span id="themeLabel">Escuro</span></button>
          <div class="clock-card"><svg class="ui-icon"><use href="./assets/icons/ui-icons.svg#clock"></use></svg><time id="clock">00:00:00</time></div>
        </div>
      </header>
      <section class="content-area" id="viewRoot" aria-live="polite">
        <div class="loading-card"><span class="spinner"></span><strong>Carregando portal…</strong></div>
      </section>
    </main>
  </div>

  <nav class="mobile-bottom-nav" aria-label="Navegação principal no celular">
    <button type="button" class="active" data-view="dashboard"><svg class="ui-icon"><use href="./assets/icons/ui-icons.svg#home"></use></svg><small>Início</small></button>
    <button type="button" data-view="birthdays"><svg class="ui-icon"><use href="./assets/icons/ui-icons.svg#cake"></use></svg><small>Aniversários</small></button>
    <button type="button" data-view="leaders"><svg class="ui-icon"><use href="./assets/icons/ui-icons.svg#users"></use></svg><small>Dirigentes</small></button>
    <button type="button" data-view="agenda"><svg class="ui-icon"><use href="./assets/icons/ui-icons.svg#calendar"></use></svg><small>Agenda</small></button>
    <button type="button" data-view="notices"><svg class="ui-icon"><use href="./assets/icons/ui-icons.svg#megaphone"></use></svg><small>Avisos</small></button>
  </nav>

  <div class="modal" id="modal" hidden>
    <button class="modal-backdrop" type="button" data-close-modal aria-label="Fechar"></button>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-header"><h2 id="modalTitle">Detalhes</h2><button class="icon-btn" type="button" data-close-modal aria-label="Fechar"><svg class="ui-icon"><use href="./assets/icons/ui-icons.svg#close"></use></svg></button></header>
      <div class="modal-body" id="modalBody"></div>
    </section>
  </div>

  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
